services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentboard
      # Local development only; override before any shared deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentboard-local-only}
      POSTGRES_DB: agentboard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    profiles: [app]
    build: .
    image: ai-router-board:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # SQLite is independent of db; opt into PostgreSQL explicitly.
      DATABASE_URL: ${DATABASE_URL:-}
      API_KEY: ${API_KEY:-}
      SERVICE_TOKENS: ${SERVICE_TOKENS:-[]}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      LLM_KEY_DIR: /run/llm-keys
      CONFIDENTIAL_REPO_ROOTS: ${CONFIDENTIAL_REPO_ROOTS:-}
    volumes:
      - appdata:/data
    stop_grace_period: 15s

volumes:
  pgdata:
  appdata:
