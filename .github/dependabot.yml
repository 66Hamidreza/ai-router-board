version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/client
      - /packages/server
      - /packages/e2e
      - /shared
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
