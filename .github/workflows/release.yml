name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: packages/e2e
      - run: npm run gate:required

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version, notes, and source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Expected vMAJOR.MINOR.PATCH[-prerelease]')
          version = tag[1:]
          if json.loads(Path('package.json').read_text())['version'] != version:
              raise SystemExit('Tag and package.json version differ')
          text = Path('CHANGELOG.md').read_text()
          match = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', text, re.M | re.S)
          if not match:
              raise SystemExit('Missing version in CHANGELOG.md')
          notes = re.sub(r'^\[[^\]]+\]:.*$', '', match.group(1), flags=re.M).strip()
          if not notes:
              raise SystemExit('Release notes are empty')
          Path('release-notes.md').write_text(notes + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
              output.write('prerelease=' + str('-' in version).lower() + '\n')
          PYTHON
          git archive --format=tar.gz --prefix="ai-router-board-${RELEASE_TAG}/" --output="ai-router-board-${RELEASE_TAG}.tar.gz" HEAD
        id: release
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/66hamidreza/ai-router-board
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          prerelease=()
          if [ "$IS_PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" "ai-router-board-${RELEASE_TAG}.tar.gz" \
            --verify-tag --title "AI Router Board ${RELEASE_TAG}" \
            --notes-file release-notes.md "${prerelease[@]}"
